<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}
    Book Management System
    {% endblock %}</title>
    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }

        h1 {
            color: #333;
        }

        a {
            text-decoration: none;
        }

        .btn {
            display: inline-block;
            padding: 8px 12px;
            margin: 3px;
            background-color: #333;
            color: white;
            border-radius: 4px;
        }

        .delete {
            background-color: red;
        }

        .edit {
            background-color: green;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            margin-top: 20px;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #333;
            color: white;
        }

        input,
        select {
            padding: 10px;
            width: 300px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        .search-box {
            margin-top: 20px;
        }

    </style>
</head>
<body>
{% block content %}
{% endblock %}
</body>
</html>
